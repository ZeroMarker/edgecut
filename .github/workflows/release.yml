name: Test, build and publish

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    # Python 3.9 binaries are available for 24.04, but not for 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install build twine coverage
      - name: Test
        run: |
          python -m coverage run --branch --source=edgecut -m unittest discover -s tests -v
          python -m coverage report --show-missing --fail-under=95
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
          python -m pip install dist/*.whl
      - name: Check installed package and release version
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          cd "$RUNNER_TEMP"
          edgecut --version
          python - <<'PY'
          import os
          from importlib.metadata import version
          import edgecut

          package_version = version('edgecut')
          assert edgecut.__version__ == package_version
          tag = os.environ['RELEASE_TAG']
          if tag:
              assert tag == f'v{package_version}', (tag, package_version)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python-version == '3.14'
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/edgecut/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
